app = "buyur-growth-panel"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  DATABASE_URL = "file:/data/buyur.db"
  TZ = "Europe/Istanbul"
  PORT = "3000"

# SQLite lives on a persistent volume â€” never on the ephemeral filesystem.
[mounts]
  source = "buyur_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1   # SQLite: single instance

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
